# 可用資料盤點（strategy-scout 判斷點子是否能在台股測試）
# access：free（FinMind 免費等級或公開網站可直接抓）／paid（需付費）／manual（需另行下載或爬蟲）
# used：本專案是否已使用
datasets:
  - {name: TaiwanStockPrice, source: FinMind, access: free, used: true, note: 日收盤、成交量、成交金額（未還原）}
  - {name: TaiwanStockDividendResult + TaiwanStockSplitPrice, source: FinMind, access: free, used: true, note: 自行還原含息報酬}
  - {name: TaiwanStockDividend, source: FinMind, access: free, used: true, note: 股利政策、除權息交易日與公告日}
  - {name: TaiwanStockMonthRevenue, source: FinMind, access: free, used: true, note: 月營收；create_time 2026-05 起才等於公告日}
  - {name: TaiwanStockFinancialStatements / BalanceSheet / CashFlowsStatement, source: FinMind, access: free, used: true, note: 季報；無實際公告日}
  - {name: TaiwanStockMarginPurchaseShortSale, source: FinMind, access: free, used: true, note: 融資融券餘額}
  - {name: TaiwanStockInstitutionalInvestorsBuySell, source: FinMind, access: free, used: true, note: 三大法人買賣超}
  - {name: TaiwanStockShareholding, source: FinMind, access: free, used: true, note: 外資持股比例、已發行股數}
  - {name: TaiwanStockSecuritiesLending, source: FinMind, access: free, used: true, note: 借券成交（費率、量）}
  - {name: TaiwanDailyShortSaleBalances, source: FinMind, access: free, used: true, note: 借券賣出餘額與可用額度}
  - {name: TaiwanStockTotalReturnIndex, source: FinMind, access: free, used: true, note: 加權指數含息}
  - {name: TaiwanFuturesDaily, source: FinMind, access: free, used: true, note: 期貨日資料（台指期）}
  - {name: TaiwanOptionDaily, source: FinMind, access: free, used: true, note: 選擇權日資料（自算台指 VIX）}
  - {name: TaiwanFuturesInstitutionalInvestors, source: FinMind, access: free, used: true, note: 期貨三大法人買賣與未平倉（data_id 為 TX、MTX 等）；已驗證免費；2018-06-05 起}
  - {name: TaiwanOptionInstitutionalInvestors, source: FinMind, access: free, used: true, note: TXO 買權／賣權 × 三大法人；2018-06-05 起}
  - {name: 三大法人區分各期貨契約, source: "期交所 futContractsDateView", access: paid, used: false, note: 資料起日 2008-04-07，但只免費提供近三年，更早需付費申請}
  - {name: 臺指選擇權 Put/Call 比, source: "期交所 pcRatio", access: free, used: false, note: 週與月契約合併；也可用快取的 TaiwanOptionDaily（2007 起）自算}
  - {name: 自結損益公告（重大訊息）, source: "公開資訊觀測站 ajax_t51sb10（keyWord=自結、keyWord2=損益／盈餘）＋內文 ajax_t05st01", access: manual, used: true, note: analysis/fetch_self_earnings.py、self_earnings_parse.py；2017–2026 共 6,034 則、按月公告 48 家；2025 年約 38 家按月公告、約一半為金融業；數字需逐則抓內文解析；兆豐金、第一金等需擴充關鍵字}
  - {name: USStockPrice, source: FinMind, access: free, used: true, note: 美股日價格，2010 起；data/fetch_supply_chain.py 已使用}
  - {name: SEC EDGAR submissions, source: "data.sec.gov/submissions/CIK##########.json", access: free, used: true, note: analysis/us_earnings_link.py；8-K items（2.02 財報）與 acceptanceDateTime（UTC，常晚於新聞稿數小時）；SEC 要求請求標頭附聯絡資訊（使用者同意使用其學校信箱）}
  - {name: Apple Supplier List, source: Apple 官方 PDF, access: manual, used: false, note: 缺 2019、2020 年版本}
  - {name: TaiwanStockDayTrading, source: FinMind, access: free, used: true, note: 當沖成交股數與買賣金額；免費但只能逐檔查（不帶代號回 400）；2014-01 起，部分上櫃股有缺日}
  - {name: 當日沖銷交易標的及統計（上市）, source: "證交所 /rwd/zh/dayTrading/TWTB4U?date=YYYYMMDD&selectType=All&response=json", access: free, used: false, note: 一天一次請求取得全部上市股票，2014-01-06 起；只有上市}
  - {name: 法人說明會一覽表, source: "公開資訊觀測站 ajax_t100sb02_1（經 /mops/api/redirectToOld，每市場每年一次）", access: free, used: false, note: 召開日期、時間、地點、擇要訊息、簡報檔名；沒有公告日期欄位；2019 年起申報較完整}
  - {name: 重大訊息全文檢索, source: "公開資訊觀測站 ajax_t51sb10（POST 舊站，可依關鍵字、市場、全年查詢，一頁 100 筆；結果列為大寫 <TR>）", access: free, used: true, note: analysis/fetch_corp_events.py；含發言日期與時間；可取得現金增資、可轉債董事會決議等事件（主旨需事前固定的分類規則），也可補法說會公告日}
  - {name: TaiwanStockNews, source: FinMind, access: free, used: true, note: 新聞標題}
  - {name: TaiwanStockHoldingSharesPer, source: FinMind, access: paid, used: false, note: 集保股權分散；集保開放資料只有最新一週}
  - {name: TaiwanStockDispositionSecuritiesPeriod, source: FinMind, access: paid, used: false, note: 改用證交所／櫃買公開查詢}
  - {name: TaiwanStockPriceAdj, source: FinMind, access: paid, used: false, note: 改用除權息自行還原}
  - {name: TaiwanStockTradingDailyReport, source: FinMind, access: paid, used: false, note: 券商分點進出}
  - {name: 處置有價證券, source: 證交所 /rwd/zh/announcement/punish、櫃買 /www/zh-tw/bulletin/disposal, access: free, used: true, note: analysis/fetch_events.py}
  - {name: 注意股, source: 證交所 /rwd/zh/announcement/notice, access: free, used: false, note: 與處置同一系統}
  - {name: 庫藏股買回, source: 公開資訊觀測站 t35sc09（/mops/api/redirectToOld）, access: free, used: true, note: analysis/fetch_events.py；其他 MOPS 彙總表可用同一方式抓}
  - {name: 景氣指標與燈號, source: 國發會開放資料, access: free, used: true, note: data_cache/ndc}
  - {name: 台指 VIX, source: 期交所, access: free, used: true, note: data_cache/taifex_vix}
  - {name: MSCI 台股權重調整結果, source: "證交所新聞列表 /rwd/zh/news/newsList?response=json&startDate=&endDate=（keyword 參數無效，需帶日期）", access: free, used: false, note: 2019 起每季新聞稿；內文格式待驗證}
  - {name: TIP 自編指數（含 00919 指數）成分異動, source: "臺灣指數公司 backend.taiwanindex.com.tw/api/downloads/technical_notices?per_page=100&page=N", access: free, used: false, note: 公告 PDF 列出納入／刪除；FTSE TWSE 系列（臺灣50、高股息）只到 2019-01}
  - {name: 臺灣50／0056 成分異動（2019 以後）, source: "新聞、PTT「[情報] 成分股調整」", access: manual, used: false, note: 需手動整理；臺灣50可用市值排名規則事前預測（正式編製規則待確認）}
  - {name: 股利分派情形彙總表（董事會決議日）, used: true, source: "公開資訊觀測站 mopsov.twse.com.tw/server-java/t05st09sub?YEAR=<民國年>&qryType=1&TYPEK=<sii|otc>&step=1（cp950）", access: free, note: analysis/dividend_surprise.py；每年每市場一次請求約 1,000 列；含董事會決議日、股東會日、期別（年度／季）、本期淨利、每股現金股利、現金股利總額；108 年（2019）起決議日才有值，107 年為 0；欄位為最新一次決議，修正案的日期可能晚於首次公告}
  - {name: 董監事／內部人持股轉讓事前申報, source: "公開資訊觀測站 POST mopsov.twse.com.tw/mops/web/ajax_t56sb21（TYPEK=sii|otc, year=民國年, smonth=01, emonth=12, sstep=1）", access: free, used: true, note: analysis/fetch_corp_events.py；每市場每年一次請求（2025 起上市太多筆需每季查詢）；申報日、身分、轉讓方式（一般交易／鉅額／盤後定價／贈與／信託）、預定股數、有效轉讓期間；只含轉讓，不含增持}
  - {name: 非擔任主管職務之全時員工薪資（員工人數）, source: "公開資訊觀測站 ajax_t100sb15（經 /mops/api/redirectToOld，TYPEK=sii|otc、RYEAR=year=民國年）", access: free, used: true, note: analysis/hiring_rate.py；每年每市場一次請求取得全部公司；107 年度（2018）起，106 年度無資料；母公司（個體）員工人數、薪資總額、平均與中位數薪資}
  - {name: 董監事持股與設質明細, source: "公開資訊觀測站 POST mopsov.twse.com.tw/mops/web/ajax_stapap1（co_id、TYPEK=all、year=民國年、month）", access: free, used: true, note: analysis/pledge.py；逐家逐月查詢，沒有整批端點；已快取 2018–2025 每年 6 月、各年前 300 名共 2,400 頁（data_cache/events/corp_raw/stapap1/）}
  - {name: 營收彙總表（含變動原因備註）, source: "公開資訊觀測站 mopsov.twse.com.tw/nas/t21/{sii|otc}/t21sc03_{民國年}_{月}_{0|1}.html（big5；0 本國、1 外國公司）", access: free, used: true, note: analysis/revenue_remarks.py；每月每市場一頁含全部公司；2018-12 ~ 2026-03 已快取（data_cache/events/corp_raw/t21/）；備註約 22% 非空白}
  - {name: 股票期貨日資料與標的清單, source: "FinMind TaiwanFuturesDaily（期貨代號 = 期交所商品代碼 + F）；期交所 /cht/2/stockLists（標的對照）", access: free, used: true, note: analysis/futures_exec.py；標準型股票期貨 249 檔（目前上市中），前 500 名有資料 245 檔已快取 2019–2026；含各月份契約與價差單，用 contract_date 6 碼篩月契約}
  - {name: 公告明細（重大訊息內文）, source: "公開資訊觀測站 ajax_t05st01", access: free, used: true, note: 可子取發行總額、承銷方式等；逐則查詢}
