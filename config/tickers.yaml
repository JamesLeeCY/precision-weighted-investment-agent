# MVP 測試股票池：純被動元件 5 支（使用者於 2026-07-03 指定）
# 注意：原名單中的奇力新(2456)已於 2021 年底併入國巨下市，改以大毅(2478)替代。
universe:
  - ticker: "2327.TW"
    name: "國巨"
    segment: "MLCC / 晶片電阻"
  - ticker: "2492.TW"
    name: "華新科"
    segment: "MLCC / 晶片電阻"
  - ticker: "3026.TW"
    name: "禾伸堂"
    segment: "高壓 MLCC / 電子零組件通路"
  - ticker: "2375.TW"
    name: "凱美"
    segment: "電容 / 被動元件（國巨集團）"
  - ticker: "2478.TW"
    name: "大毅"
    segment: "晶片電阻 / 保護元件"

benchmark:
  ticker: "0050.TW"   # 超額報酬基準（含息還原；0050 於 2025-06-18 一拆四）

backtest:
  start_date: "2023-01-01"
  end_date: "2026-05-31"
  # 使用者決策（2026-07-03）：horizon = 20 個交易日，
  # 應驗判定 = 期末收盤價絕對報酬 > 0（規格 9.2 之人工決策）
  horizon_days: 20
  outcome_rule: "absolute_return_positive"
  # outcome 用哪種報酬判定：price（未還原收盤價，原始決策）或 total_return（含息還原）
  # 未還原價在除權息日有價格斷層（如國巨 2025-08 分割 546→136.5）；使用者決策（2026-10-06）：改用 total_return
  outcome_basis: "total_return"
  # 報酬層級評估：long/neutral 組合的單邊交易成本（手續費 0.1425%×2 + 證交稅 0.3%，均攤兩邊）
  cost_per_side: 0.0029625
  # 每隔幾個交易日產生一次預測（walk-forward 的取樣頻率）
  prediction_step_days: 10

# 參與合併的 Agent（--agents 可覆寫）。對照組：
#   MVP 2 Agent：--agents fundamentals_agent,news_agent
#   Phase 2 前 3 Agent：--agents fundamentals_agent,news_agent,macro_agent
agents:
  - fundamentals_agent
  - news_agent
  - macro_agent
  - supply_chain_agent

supply_chain:
  graph: "config/supply_chain_graph.json"   # 依 2024 年報修訂的知識圖譜（下游為需求代理，非確認客戶）
  window_days: 20                           # 股價動能觀察窗口（交易日）
  # 關聯公司股價與營收的抓取起點（固定值，快取鍵不隨回測期間變動）；
  # 長期回測需早於回測起點 13 個月以上。2023-01-01 為 v1 圖譜回測所用
  history_start: "2017-01-01"

macro:
  window_days: 20            # 籌碼、匯率、大盤外資的觀察窗口（交易日）
  rate_window_days: 60       # 美債殖利率變化的觀察窗口（交易日）

arbitrator:
  # 規格 5.2（2026-10-07 修訂）：final_score = 2·合併機率 − 1
  # > 0.1 → bullish、< -0.1 → bearish，即合併機率 > 0.55 / < 0.45（事先設定）
  bullish_threshold: 0.1
  bearish_threshold: -0.1
  ema_alpha: 0.2             # 規格 5.3：Brier EMA 平滑係數
  epsilon: 0.01              # 規格 5.1：precision = 1/(brier_ema + epsilon)
  cold_start_min_n: 5        # 規格 5.1：n_predictions < 5 時採冷啟動均值
  # Agent 層級重新校準（arbitrator/calibration.py）：p' = σ(a·logit p)，a ∈ [0,1]
  # 事先固定、不依回測結果調整
  calibration_min_n: 10              # 每個 Agent 累積滿 10 筆已到期預測才開始校準
  calibration_prior_strength: 2.0    # 往 a=1（不修正）的先驗強度

news:
  window_days: 14            # 規格 3.3：新聞 Agent 預設時間窗
  # 是否為入選新聞抓取內文摘要（data/fetch_article.py；--news-content 可覆寫）
  fetch_content: false

llm:
  # provider：anthropic（需 ANTHROPIC_API_KEY）或 ollama（地端模型）
  # 回測可用 --llm-provider / --llm-model / --llm-think 覆寫
  provider: "anthropic"
  model: "claude-sonnet-4-6"
  # auto：anthropic 偵測到 API key 才啟用；ollama 連得上伺服器且有該模型才啟用。
  # 不可用時各 Agent 一律使用規則式 fallback
  enabled: auto
  base_url: "http://localhost:11434"   # ollama 伺服器
  think: null                          # 推理模型（qwen3）的思考模式；null = 不傳
  options:
    num_ctx: 4096                      # ollama context 長度（新聞 prompt 約 1.5k token）
  # 回應快取（納入版控）：地端模型在 CPU 上每次呼叫數十秒，快取讓回測可中斷續跑
  cache_dir: "data_cache/llm"
