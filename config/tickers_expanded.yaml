benchmark:
  ticker: 0050.TW
backtest:
  start_date: '2019-01-01'
  end_date: '2026-05-31'
  horizon_days: 20
  outcome_rule: absolute_return_positive
  outcome_basis: total_return
  cost_per_side: 0.0029625
  prediction_step_days: 21
# 2026-10-10 起預設只放財報 Agent；既有報表的 3 Agent 組成：--agents fundamentals_agent,macro_agent,supply_chain_agent
agents:
- fundamentals_agent
supply_chain:
  graph: config/supply_chain_graph_expanded.json
  window_days: 20
  history_start: '2017-01-01'
macro:
  window_days: 20
  rate_window_days: 60
  history_start: '2017-01-01'
arbitrator:
  bullish_threshold: 0.1
  bearish_threshold: -0.1
  ema_alpha: 0.2
  epsilon: 0.01
  cold_start_min_n: 5
  calibration_min_n: 10
  calibration_prior_strength: 2.0
  # 產業內 IC 加權（arbitrator/ic_weighting.py）：最近 24 個已到期時點、滿 6 個才啟用（事先固定）
  ic_window_dates: 24
  ic_min_dates: 6
news:
  window_days: 14
  fetch_content: false
llm:
  provider: anthropic
  model: claude-sonnet-4-6
  enabled: auto
  base_url: http://localhost:11434
  think: null
  options:
    num_ctx: 4096
  cache_dir: data_cache/llm
fundamentals:
  history_start: '2017-01-01'
